name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/build-community-hub/assets/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/build-community-hub/assets/starter/requirements.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.in
      - run: python -m pytest -q
      - run: python -m ruff check app config glue libs services tests
      - run: python ../../scripts/validate_project.py .
      - run: python ../../scripts/audit_public.py ../../../..
