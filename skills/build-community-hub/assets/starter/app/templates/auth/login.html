{% extends "base.html" %}
{% block title %}登录 · {{ community.site.name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>登录</h1><p class="sub">{{ community.site.tagline }}</p></div>
<form class="form-card" method="post" action="/login">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="hidden" name="next_url" value="{{ next_url or '' }}">
  <label class="field">用户名 <span class="req">*</span></label>
  <input type="text" name="username" required>
  <label class="field">密码 <span class="req">*</span></label>
  <input type="password" name="password" required>
  <button class="btn" type="submit">登录</button>
  <p class="hint">还没有账号？凭邀请码 <a href="/register">注册</a></p>
</form>
{% endblock %}
